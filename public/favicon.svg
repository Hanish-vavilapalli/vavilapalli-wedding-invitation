<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="maroonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1208" />
      <stop offset="100%" stop-color="#190603" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#maroonBg)" stroke="url(#kalashGold)" stroke-width="1.5" />

  <!-- Coconut on top -->
  <circle cx="32" cy="22" r="7" fill="url(#kalashGold)" />
  <circle cx="32" cy="15" r="2.5" fill="#EF4444" />

  <!-- Mango leaves spreading out -->
  <path d="M 22 25 C 20 20, 24 16, 28 20 Z" fill="#22C55E" />
  <path d="M 42 25 C 44 20, 40 16, 36 20 Z" fill="#22C55E" />

  <!-- Kalash Pot Body -->
  <path d="M 24 28 L 40 28 L 44 38 C 45 44, 38 48, 32 48 C 26 48, 19 44, 20 38 Z" fill="url(#kalashGold)" stroke="#92400E" stroke-width="0.8" />
  
  <!-- Base of Kalash -->
  <rect x="26" y="47" width="12" height="3" rx="1.5" fill="url(#kalashGold)" />

  <!-- Auspicious Tilak line on Kalash -->
  <line x1="28" y1="36" x2="36" y2="36" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="32" cy="33" r="1.2" fill="#EF4444" />
</svg>
