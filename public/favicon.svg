<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="gvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1208" />
      <stop offset="100%" stop-color="#190603" />
    </linearGradient>
    <filter id="gvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="64" cy="64" r="60" fill="url(#gvBg)" stroke="url(#gvGold)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#gvGold)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6" />

  <!-- Top delicate crown/diamond detail -->
  <polygon points="64,16 67.5,21 64,26 60.5,21" fill="url(#gvGold)" />

  <!-- Modern {GV} Typography with brackets -->
  <g filter="url(#gvGlow)">
    <text
      x="64"
      y="75"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'Playfair Display', 'Cinzel', Georgia, serif"
      font-weight="700"
      font-size="42"
      fill="url(#gvGold)"
      letter-spacing="1"
    >
      <tspan font-family="system-ui, sans-serif" font-weight="300" font-size="36" fill="#FDE68A" opacity="0.85">{</tspan><tspan dx="1">G</tspan><tspan dx="1">V</tspan><tspan font-family="system-ui, sans-serif" font-weight="300" font-size="36" fill="#FDE68A" opacity="0.85">}</tspan>
    </text>
  </g>

  <!-- Bottom micro sparkle/flourish -->
  <circle cx="64" cy="98" r="2" fill="url(#gvGold)" />
  <line x1="48" y1="98" x2="60" y2="98" stroke="url(#gvGold)" stroke-width="1" opacity="0.7" />
  <line x1="68" y1="98" x2="80" y2="98" stroke="url(#gvGold)" stroke-width="1" opacity="0.7" />
</svg>

